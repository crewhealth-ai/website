<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CrewHealth.AI OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Instrument+Serif:ital@1&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #dde2ff; --bg2: #b9c2ff; --fg: #111735; --muted: #4a5578; --line: #e1e5f6;
    --primary: #2f5bea; --accent: #5b7bff; --card: #ffffff; --grid: rgb(255 255 255 / 0.45);
    --heading: "Outfit", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Noto Sans", sans-serif; color: var(--fg);
    background:
      linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(180deg, var(--bg2), var(--bg1));
    display: grid; grid-template-columns: 1fr 440px; gap: 48px; padding: 72px 80px;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-family: var(--heading); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
    h1 { font-family: var(--heading); font-weight: 600; font-size: 64px; line-height: 1.02; letter-spacing: -0.03em; margin-top: 44px; max-width: 620px; }
  h1 em { font-style: normal; color: var(--primary); }
  h1 em { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.06em; }
  p.sub { margin-top: 24px; font-size: 32px; line-height: 1.3; color: var(--muted); max-width: 560px; }
  .stack { position: relative; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 30px; margin-top: 24px; box-shadow: 0 30px 60px -30px rgb(15 23 42 / 0.25); }
  .card + .card { margin-top: 16px; }
  .card .label { font-size: 20px; color: var(--muted); }
  .card .value { font-family: var(--heading); font-weight: 600; font-size: 72px; letter-spacing: -0.04em; line-height: 1; margin-top: 6px; }
  .card .delta { font-size: 16px; font-weight: 500; margin-top: 10px; color: var(--accent); }
  .live { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--accent); margin-bottom: 14px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .bars { display: flex; align-items: flex-end; gap: 7px; height: 72px; margin-top: 18px; }
  .bars i { flex: 1; border-radius: 4px; background: var(--line); display: block; }
  .bars i:last-child { background: linear-gradient(to top, var(--primary), var(--accent)); }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 64 64" width="48" height="48"><rect width="64" height="64" rx="16" fill="#2f5bea"/><circle cx="22" cy="38" r="10" fill="#fff" stroke="#2f5bea" stroke-width="3"/><circle cx="42" cy="38" r="10" fill="#fff" stroke="#2f5bea" stroke-width="3"/><circle cx="32" cy="24" r="10" fill="#c7d2ff" stroke="#2f5bea" stroke-width="3"/></svg>
      <span>CrewHealth<span style="color:#2f5bea">.AI</span></span>
    </div>
    <h1>AI agents and analytics for <em>healthcare</em> teams.</h1>
    <p class="sub">Close every care gap, follow up after every discharge. Clinicians approve. Agents do the legwork.</p>
  </div>
  <div class="stack">
    <div class="card">
      <div class="live"><i></i> Live agent activity</div>
      <div class="label">Gaps closed today</div>
      <div class="value">142</div>
      <div class="delta">+18 vs yesterday</div>
      <div class="bars"><i style="height:24%"></i><i style="height:34%"></i><i style="height:29%"></i><i style="height:44%"></i><i style="height:49%"></i><i style="height:46%"></i><i style="height:62%"></i><i style="height:66%"></i><i style="height:57%"></i><i style="height:73%"></i><i style="height:83%"></i><i style="height:100%"></i></div>
    </div>
</div>
  </div>
</body>
</html>
